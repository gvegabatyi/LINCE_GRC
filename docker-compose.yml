# PostgreSQL para desarrollo de Lince GRC (equipo local o servidor on-premise).
# Credenciales desde .env (ver .env.example). El default de la contraseña es SÓLO
# para desarrollo en loopback. Por defecto el puerto se publica sólo en 127.0.0.1;
# para dar acceso desde la LAN definir POSTGRES_BIND (p. ej. la IP del servidor)
# y una POSTGRES_PASSWORD fuerte.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lince-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-lince_grc}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lince_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lince_pgdata:
