# PostgreSQL para desarrollo de Lince GRC en el equipo de cada desarrollador.
#
# Modo de desarrollo SIN CLAVES: POSTGRES_HOST_AUTH_METHOD=trust acepta conexiones
# sin contraseña. Es seguro sólo porque el puerto se publica en 127.0.0.1 (este
# equipo). NO cambiar POSTGRES_BIND a una IP de red manteniendo trust: la base
# quedaría abierta a toda la LAN. Para un servidor compartido usar
# POSTGRES_HOST_AUTH_METHOD=scram-sha-256 con una POSTGRES_PASSWORD fuerte.
#
# Nota: el método de autenticación se fija al inicializar el volumen por primera
# vez; un volumen existente conserva el método con el que fue creado.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lince-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lince_grc}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lince_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lince_pgdata:
